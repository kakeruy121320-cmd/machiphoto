<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まちフォト（投稿機能つき）</title>

  <style>
    body {
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f8f8f8;
      margin: 0;
      text-align: center;
    }

    header {
      background: #2196f3;
      color: white;
      padding: 20px 0;
      font-size: 1.6em;
      letter-spacing: 2px;
    }

    #searchBox {
      margin: 20px;
      padding: 10px 20px;
      width: 60%;
      max-width: 400px;
      border: 2px solid #2196f3;
      border-radius: 25px;
      font-size: 1em;
      outline: none;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .gallery-item {
      position: relative;
      width: 220px;
      text-align: center;
      cursor: pointer;
    }

    img {
      width: 220px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    img:hover {
      transform: scale(1.05);
    }

    .tag {
      margin-top: 8px;
      background: #eee;
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.9em;
    }

    .download-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.8em;
      cursor: pointer;
      user-select: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal img {
      width: 80%;
      height: auto;
      max-width: 900px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    .modal p {
      color: white;
      font-size: 1.2em;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>まちフォト</header>

  <!-- ★ 投稿フォーム（画像＋タグ） -->
  <div style="margin: 20px;">
    <input type="file" id="fileInput"><br><br>
    <input type="text" id="tagInput" placeholder="タグを入力（例：札幌）" style="padding:8px; width:200px;">
    <button id="uploadBtn">アップロード</button>
  </div>

  <input type="text" id="searchBox" placeholder="検索">

  <div class="gallery"></div>

  <div class="modal" id="modal">
    <div>
      <img src="" alt="">
      <p id="modalTag"></p>
    </div>
  </div>

  <!-- ★ Firebase SDK & 投稿機能 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ★ あなたの Firebase 設定をここに貼る
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "machi-photo.firebaseapp.com",
      projectId: "machi-photo",
      storageBucket: "machi-photo.firebasestorage.app",
      messagingSenderId: "YOUR_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    const gallery = document.querySelector(".gallery");
    const modal = document.getElementById("modal");
    const modalImg = modal.querySelector("img");
    const modalTag = document.getElementById("modalTag");
    const searchBox = document.getElementById("searchBox");
    let images = [];

    // CSV 読み込み
    async function loadCSV() {
      try {
        const response = await fetch("data.csv");
        if (!response.ok) throw new Error("CSVファイルが見つかりません。");
        const data = await response.text();

        const lines = data.trim().split("\n").slice(1);
        images = lines.map(line => {
          const [file, tag] = line.split(",");
          return { file: file.trim(), tag: tag.trim() };
        });

        renderGallery();
      } catch (error) {
        gallery.innerHTML = `<p style="color:red;">CSVの読み込みに失敗しました。<br>${error.message}</p>`;
      }
    }

    // ギャラリー描画
    function renderGallery(filter = "") {
      gallery.innerHTML = "";
      const filtered = images.filter(img => img.tag.includes(filter));

      if (filtered.length === 0) {
        gallery.innerHTML = "<p>該当する画像がありません。</p>";
        return;
      }

      filtered.forEach(img => {
        const item = document.createElement("div");
        item.className = "gallery-item";

        item.innerHTML = `
          <img src="${img.file}" alt="${img.tag}">
          <div class="tag">${img.tag}</div>
          <div class="download-btn">⬇</div>
        `;

        gallery.appendChild(item);

        item.querySelector("img").onclick = () => {
          modalImg.src = img.file;
          modalTag.textContent = img.tag;
          modal.style.display = "flex";
        };

        const dlBtn = item.querySelector(".download-btn");
        dlBtn.onclick = (e) => {
          e.stopPropagation();
          const a = document.createElement("a");
          a.href = img.file;
          a.download = img.file.split("/").pop();
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
      });
    }

    searchBox.addEventListener("input", e => {
      renderGallery(e.target.value);
    });

    modal.onclick = () => {
      modal.style.display = "none";
    };

    // ★ 投稿処理（画像＋タグ）
    const fileInput = document.getElementById("fileInput");
    const tagInput = document.getElementById("tagInput");
    const uploadBtn = document.getElementById("uploadBtn");

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      const tag = tagInput.value.trim();

      if (!file) return alert("ファイルを選択してください");
      if (!tag) return alert("タグを入力してください");

      const storageRef = ref(storage, "uploads/" + file.name);

      try {
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        // Firestore に保存
        await addDoc(collection(db, "photos"), {
          file: url,
          tag: tag,
          createdAt: new Date()
        });

        alert("アップロード完了！");

        fileInput.value = "";
        tagInput.value = "";

      } catch (error) {
        alert("アップロードに失敗しました: " + error.message);
      }
    });

    loadCSV();
  </script>
</body>
</html>
